<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reseller Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  html, body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body { overflow-x: hidden; min-width: 0; }
  button, input, select, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  @media (max-width: 767px) {
    #root { width: 100%; min-width: 0; }
  }
  @keyframes pulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(194,59,59,0.45); } 50% { box-shadow: 0 0 0 5px rgba(194,59,59,0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function () {
  function showFatal(message) {
    console.error(message);
    var root = document.getElementById('root');
    root.innerHTML = '<div style="font-family:Arial,sans-serif;padding:30px;max-width:900px;margin:auto"><h2>Reseller Portal could not start</h2><p>' + String(message).replace(/</g, '&lt;') + '</p><p>Open F12 → Console for the full error.</p></div>';
  }

  if (!window.React) return showFatal('React did not load. Try refreshing with Ctrl+F5. If it still fails, check F12 → Console for a blocked CDN request.');
  if (!window.ReactDOM) return showFatal('ReactDOM did not load.');
  if (!window.Babel) return showFatal('Babel did not load.');
  if (!window.firebase) return showFatal('Firebase did not load.');

  fetch('./app.js', { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('Could not load app.js (HTTP ' + response.status + ').');
      return response.text();
    })
    .then(function (source) {
      var result = Babel.transform(source, {
        presets: ['react'],
        sourceType: 'script'
      });
      var run = new Function(result.code + '\n//# sourceURL=app.js');
      run();
    })
    .catch(function (error) {
      showFatal(error && error.stack ? error.stack : error);
    });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.0/babel.min.js"></script>
<script type="text/babel" src="app.js"></script>
</body>
</html>
